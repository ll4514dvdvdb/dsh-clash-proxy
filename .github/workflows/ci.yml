name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines.node` says >=20; test every release line we claim to support.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check every source file
        run: |
          set -euo pipefail
          find lib scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) | while read -r file; do
            node --check "$file"
          done

      - name: Unit and integration tests (offline)
        run: npm test

      - name: Panel / host / controller / client smoke tests (offline)
        run: npm run smoke

      # smoke.mjs (repo root) needs the public internet and a real subscription, so
      # it is deliberately not part of CI. Run it locally with `npm run smoke:net`.
      # This is a documented gap, not a passing result.

      - name: Dependency audit
        # Registry outages must not turn a code review into a red build, but the
        # step still surfaces findings in the log. High/critical are reported.
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

  package:
    name: package contents
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Files that must ship
        run: |
          set -euo pipefail
          for file in package.json README.md LICENSE cordis.patch.yml \
                      lib/index.js lib/client.js lib/provider.js \
                      lib/core/tunnel.js lib/core/rules.js lib/core/proxy-server.js \
                      lib/core/transports.js lib/core/fs-atomic.js \
                      lib/panel/routes.js lib/panel/controller.js lib/panel/store.js \
                      web/index.html web/app.js web/app.css; do
            test -f "$file" || { echo "missing $file"; exit 1; }
          done
      - name: Token placeholder still present
        run: |
          set -euo pipefail
          grep -q '__CLASH_PROXY_TOKEN__' web/index.html || {
            echo "web/index.html lost the placeholder routes.js replaces with the panel token" >&2
            exit 1
          }
